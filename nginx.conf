# ==============================================================================
# CENTRAL PRIVADA DE CONEXÕES ZATTEN — NGINX REVERSE PROXY & WAF
# Produção VPS: TLS 1.3, Proxy Reverso, Rate Limiting de Borda e Headers HSTS
# ==============================================================================

# Zonas de Rate Limiting por IP (Borda da VPS)
limit_req_zone $binary_remote_addr zone=rate_auth:10m rate=10r/m;       # Proteção anti-brute-force OAuth
limit_req_zone $binary_remote_addr zone=rate_mcp:10m rate=30r/s;        # Tráfego ChatGPT / MCP
limit_req_zone $binary_remote_addr zone=rate_general:10m rate=20r/s;    # Painel administrativo
limit_req_status 429;

# Upstreams internos isolados (Sem exposição pública)
upstream backend_app {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. REDIRECIONAMENTO GLOBAL HTTP (80) -> HTTPS (443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.firstsys.com.br mcp.firstsys.com.br keys.firstsys.com.br _;

    # Desafio ACME Let's Encrypt para renovação automática via Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. SERVIDOR DE AUTENTICAÇÃO OAUTH 2.1 (auth.firstsys.com.br)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.firstsys.com.br;

    # Certificados TLS / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/auth.firstsys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.firstsys.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2M;

    # Headers de Segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    # Endpoints de Descoberta OIDC & JWKS (Cache público permitido)
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|jwks\.json) {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
    }

    # Endpoint de Token com Rate Limit Rigoroso
    location /oauth/token {
        limit_req zone=rate_auth burst=10 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Demais rotas OAuth
    location / {
        limit_req zone=rate_auth burst=20 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ------------------------------------------------------------------------------
# 3. RECURSO PROTEGIDO MCP REMOTO (mcp.firstsys.com.br)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.firstsys.com.br;

    ssl_certificate /etc/letsencrypt/live/mcp.firstsys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.firstsys.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 5M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Metadados de Recurso Protegido para Descoberta pelo ChatGPT
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://backend_app/.well-known/oauth-protected-resource;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1h;
    }

    # Roteamento do Servidor MCP com Rate Limiting e Buffering desabilitado para SSE
    location / {
        limit_req zone=rate_mcp burst=50 nodelay;
        proxy_pass http://backend_app/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Suporte a SSE / Streaming do MCP
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ------------------------------------------------------------------------------
# 4. PAINEL ADMINISTRATIVO WEB (keys.firstsys.com.br)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keys.firstsys.com.br;

    ssl_certificate /etc/letsencrypt/live/keys.firstsys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keys.firstsys.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2M;

    # Security Headers & CSP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://auth.firstsys.com.br https://mcp.firstsys.com.br https://api.zatten.com;" always;

    # Bloqueio WAF contra scanners
    if ($http_user_agent ~* (nikto|sqlmap|acunetix|w3af|netsparker|dirbuster|pangolin|nmap)) {
        return 403 "Acesso bloqueado por politica WAF de seguranca.\n";
    }

    # API Proxy para o backend na rede interna
    location /api/ {
        proxy_pass http://backend_app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Roteamento SPA
    location / {
        limit_req zone=rate_general burst=25 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
